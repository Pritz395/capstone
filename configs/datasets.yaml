# Dataset registry for the multi-source breast-cancer corpus.
# Schemas are NOT interchangeable. Never row-bind incompatible feature matrices.

project:
  random_seed: 42
  label_column: diagnosis
  provenance_column: dataset_id
  min_corpus_size: 2000

datasets:
  wdbc:
    enabled: true
    modality: tabular
    schema_id: wdbc_v1_30features
    path: data/wdbc
    task: binary_benign_malignant
    n_features: 30
    license: "UCI ML Repository — cite Wolberg et al."
    notes: "Wisconsin Diagnostic Breast Cancer — primary Week 1–3 tabular baseline."

  wbcd_original:
    enabled: true
    modality: tabular
    schema_id: wbcd_v1_9features
    path: data/wbcd
    task: binary_benign_malignant
    n_features: 9
    license: "UCI ML Repository (id=15) — cite Wolberg (1990)."
    notes: "Wisconsin Original. Different 9 ordinal features — NOT compatible with WDBC columns."

  busi:
    enabled: true
    modality: image
    schema_id: busi_v1_image
    path: data/busi
    task: multiclass_normal_benign_malignant
    n_features: null
    license: "Cite Al-Dhabyani et al., Data in Brief 2020; HF mirror MedOtter/BUSI."
    notes: "BUSI ultrasound images. Image modality for Week 5+; registered in corpus only for Week 3–4."

  breakhis:
    enabled: false
    modality: image
    schema_id: breakhis_v1_image
    path: data/breakhis
    task: binary_benign_malignant
    n_features: null
    license: "Non-commercial research — cite Spanhol et al., IEEE TBME 2016."
    notes: "BreakHis (~7909 images). Enable after download for Week 8+ scale-up."
