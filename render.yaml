services:
  - type: web
    name: capstone-breast-xai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
